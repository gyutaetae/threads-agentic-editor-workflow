name: Update Weekly Editorial Memory

on:
  workflow_dispatch:
  schedule:
    # Monday 10:00 KST, after the weekly metrics collection window has run.
    - cron: "0 1 * * 1"

jobs:
  update-memory:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update weekly editorial memory
        shell: pwsh
        run: python .\scripts\update_weekly_editorial_memory.py --metrics-path ".\threads-post-metrics.csv" --output-path ".\daily-editor\memory\weekly-editorial-memory.md" --days 7

      - name: Commit memory updates
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-editor/memory/weekly-editorial-memory.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update weekly Threads editorial memory"
            git push
          }
