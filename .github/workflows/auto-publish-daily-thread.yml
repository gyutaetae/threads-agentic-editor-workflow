name: Auto Publish Daily Threads Chain

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Threads. false means generate and dry-run only."
        required: true
        default: true
        type: boolean
      posts_per_day:
        description: "Keep 1 for current behavior. 2 enables future morning/evening expansion."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      post_slot:
        description: "Manual experiment slot."
        required: true
        default: "morning"
        type: choice
        options:
          - "morning"
          - "evening"
  schedule:
    # Start at 18:00 KST. GitHub may queue scheduled jobs briefly under load.
    - cron: "0 18 * * *"
      timezone: "Asia/Seoul"

concurrency:
  group: threads-daily-publish
  cancel-in-progress: false

jobs:
  auto-publish:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: google/gemma-4-26b-a4b-it:free
      LLM_FALLBACK_PROVIDER: ""
      LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS || '900' }}
      AUTO_PUBLISH_QUALITY_SCORE: ${{ vars.AUTO_PUBLISH_QUALITY_SCORE || '85' }}
      DRAFT_QUALITY_SCORE: ${{ vars.DRAFT_QUALITY_SCORE || '70' }}
      EVALUATOR_PUBLISH_SCORE: ${{ vars.EVALUATOR_PUBLISH_SCORE || '85' }}
      EVALUATOR_PROVIDER: ${{ vars.EVALUATOR_PROVIDER || '' }}
      EVALUATOR_MODEL: ${{ vars.EVALUATOR_MODEL || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      GENERATION_CANDIDATES: ${{ vars.GENERATION_CANDIDATES || '3' }}
      POSTS_PER_DAY: ${{ github.event_name == 'schedule' && '1' || inputs.posts_per_day || vars.POSTS_PER_DAY || '1' }}
      POST_SLOT: ${{ inputs.post_slot || 'morning' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_IMAGE_URL: ${{ vars.THREADS_IMAGE_URL || '' }}
      THREADS_ALT_TEXT: ${{ vars.THREADS_ALT_TEXT || '' }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Check for a manual post today
        id: daily_guard
        shell: pwsh
        run: |
          if ($env:REQUESTED_PUBLISH -ne "true") {
            "decision=dry_run" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_generate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          python .\scripts\daily_publish_guard.py --stage preflight
          $guardExit = $LASTEXITCODE
          if ($guardExit -eq 0) {
            "decision=allow_auto_publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_generate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ($guardExit -eq 10) {
            "decision=skip_manual_post" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_generate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "## Auto thread skipped" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "A top-level Threads post already exists today (KST)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          "decision=block_on_guard_error" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_generate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "## Auto thread blocked" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "The Threads daily guard failed closed. See daily-editor/failures artifacts." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $guardExit

      - name: Resolve schedule experiment
        shell: pwsh
        run: |
          $schedule = "${{ github.event.schedule }}"
          if ($schedule -eq "0 18 * * *") {
            "POST_SLOT=evening" | Out-File -FilePath $env:GITHUB_ENV -Append
            "POSTS_PER_DAY=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "EXPERIMENT_GROUP=daily_1800_kst" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "EXPERIMENT_GROUP=manual_$env:POST_SLOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Collect candidates
        id: collect
        if: steps.daily_guard.outputs.should_generate == 'true'
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          .\scripts\run-daily-agentic-editor.ps1 -PerQuery 10 -PerFeed 10 -ReadmeTop 10 -Date $date -AllowEmpty
          $candidatesPath = ".\daily-editor\$date-candidates.json"
          $candidates = Get-Content $candidatesPath -Raw | ConvertFrom-Json -NoEnumerate
          if ($candidates.Count -eq 0) {
            "skip_auto_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "## Auto thread skipped" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "No unused candidates were found for $date, so generation and publishing were skipped." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "skip_auto_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Generate approved chain
        id: generate
        if: steps.daily_guard.outputs.should_generate == 'true' && steps.collect.outputs.skip_auto_publish != 'true'
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          python .\scripts\generate_auto_thread.py `
            --date $date `
            --candidates-path ".\daily-editor\$date-candidates.json" `
            --output-path ".\approved-thread-chain.txt" `
            --spec-output-path ".\approved-thread-spec.json" `
            --metadata-path ".\daily-editor\auto-thread-metadata.json" `
            --metrics-path ".\threads-post-metrics.csv" `
            --posts-per-day ([int]$env:POSTS_PER_DAY) `
            --post-slot $env:POST_SLOT `
            --experiment-group $env:EXPERIMENT_GROUP
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            "auto_publish_status=publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ($exitCode -eq 2) {
            "auto_publish_status=draft" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ($exitCode -eq 3) {
            "auto_publish_status=rejected" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "auto_publish_status=error" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $exitCode

      - name: Summarize review draft
        if: ${{ always() && steps.daily_guard.outputs.should_generate == 'true' && steps.collect.outputs.skip_auto_publish != 'true' && steps.generate.outputs.should_publish != 'true' }}
        shell: pwsh
        run: |
          "## Auto thread pending review" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Status: ${{ steps.generate.outputs.auto_publish_status || 'error' }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path ".\daily-editor\review") {
            "### Review drafts" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-ChildItem ".\daily-editor\review" -Filter "*.txt" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 5 |
              ForEach-Object { "- $($_.FullName)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          } else {
            "No review draft directory was created." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if (Test-Path ".\daily-editor\auto-thread-metadata.json") {
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "### Metadata" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "````json" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content ".\daily-editor\auto-thread-metadata.json" -Raw |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload review drafts
        if: ${{ always() && steps.daily_guard.outputs.should_generate == 'true' && steps.collect.outputs.skip_auto_publish != 'true' && steps.generate.outputs.should_publish != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: auto-thread-review-drafts
          path: |
            daily-editor/review/**
            daily-editor/auto-thread-metadata.json
            daily-editor/runs/**
            daily-editor/evaluations/**
            approved-thread-spec.json
          if-no-files-found: ignore

      - name: Validate generated chain
        if: ${{ steps.daily_guard.outputs.should_generate == 'true' && steps.collect.outputs.skip_auto_publish != 'true' && steps.generate.outputs.should_publish == 'true' }}
        shell: pwsh
        run: .\scripts\publish-approved-chain.ps1 -SpecPath ".\approved-thread-spec.json" -Topic "auto generated" -SourceCount 0 -DryRun

      - name: Recheck for a manual post before publishing
        id: prepublish_guard
        if: ${{ steps.daily_guard.outputs.should_generate == 'true' && steps.collect.outputs.skip_auto_publish != 'true' && steps.generate.outputs.should_publish == 'true' && (github.event_name == 'schedule' || inputs.publish == true) }}
        shell: pwsh
        run: |
          python .\scripts\daily_publish_guard.py --stage prepublish
          $guardExit = $LASTEXITCODE
          if ($guardExit -eq 0) {
            "decision=allow_auto_publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ($guardExit -eq 10) {
            "decision=skip_manual_post" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "## Auto thread cancelled before publish" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "A manual top-level post appeared while the draft was being generated." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          "decision=block_on_guard_error" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "## Auto thread blocked before publish" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "The final Threads API check failed closed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $guardExit

      - name: Publish generated chain
        if: ${{ steps.prepublish_guard.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          try {
            $metadata = Get-Content ".\daily-editor\auto-thread-metadata.json" -Raw | ConvertFrom-Json
            .\scripts\publish-approved-chain.ps1 `
              -SpecPath ".\approved-thread-spec.json" `
              -Topic $metadata.topic `
              -Format $metadata.format `
              -ContentAxis $metadata.content_axis `
              -FormatType $metadata.format_type `
              -PostGoal $metadata.post_goal `
              -FinalCandidateScore ([string]$metadata.final_candidate_score) `
              -QualityScore ([string]$metadata.quality_score) `
              -SourceType $metadata.source_type `
              -PostSlot $metadata.post_slot `
              -ExperimentGroup $metadata.experiment_group `
              -Model $metadata.model `
              -SourceCount ([int]$metadata.source_count) `
              -SourceName $metadata.source_name `
              -SourceUrl $metadata.source_url `
              -Series $metadata.series `
              -SeriesPart $metadata.series_part `
              -PublicTheme $metadata.public_theme `
              -TopicPillar $metadata.topic_pillar `
              -WorkflowStage $metadata.workflow_stage `
              -FailureMode $metadata.failure_mode `
              -SolutionPattern $metadata.solution_pattern `
              -BadRequest $metadata.bad_request `
              -QuoteUsed:([bool]$metadata.quote_used) `
              -QuoteId $metadata.quote_id `
              -QuoteSpeaker $metadata.quote_speaker `
              -QuoteSourceUrl $metadata.quote_source_url `
              -HumanSignalSource $metadata.human_signal_source `
              -HumanSignalType $metadata.human_signal_type `
              -ResearchProblem $metadata.research_problem `
              -ArtifactType $metadata.artifact_type `
              -HookPattern $metadata.hook_pattern `
              -StructurePattern $metadata.structure_pattern `
              -CloserPattern $metadata.closer_pattern `
              -ReusableUnitType $metadata.reusable_unit_type `
              -Origin "auto_openrouter" `
              -CardUsed:([bool]$env:THREADS_IMAGE_URL)
          } catch {
            $now = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, "Korea Standard Time")
            $message = [string]$_
            if ($env:THREADS_ACCESS_TOKEN) {
              $message = $message.Replace($env:THREADS_ACCESS_TOKEN, "<redacted>")
            }
            $errorType = if ($message -match "code.?190|401|403|token") { "threads_token_expired_or_invalid" } else { "threads_publish_error" }
            New-Item -ItemType Directory -Force -Path ".\daily-editor\failures" | Out-Null
            $failure = [ordered]@{
              date = $now.ToString("yyyy-MM-dd")
              failed_at = $now.ToString("o")
              stage = "publish"
              error_type = $errorType
              error = $message.Substring(0, [Math]::Min($message.Length, 4000))
            }
            $failure | ConvertTo-Json -Depth 4 | Set-Content -Path ".\daily-editor\failures\$($failure.date)-publish-$errorType.json" -Encoding utf8
            throw
          }

      - name: Commit operational records
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path ".\content-history.jsonl") {
            git add -f content-history.jsonl
          }
          if (Test-Path ".\threads-post-metrics.csv") {
            git add -f threads-post-metrics.csv
          }
          if (Test-Path ".\daily-editor\failures") {
            git add -f daily-editor/failures/*.json
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record Threads automation state"
            git push
          }

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-thread-run
          path: |
            approved-thread-chain.txt
            approved-thread-spec.json
            content-history.jsonl
            threads-post-metrics.csv
            daily-editor/**
          if-no-files-found: ignore
