name: Auto Publish Daily Threads Chain

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Threads. false means generate and dry-run only."
        required: true
        default: true
        type: boolean
      posts_per_day:
        description: "Keep 1 for current behavior. 2 enables future morning/evening expansion."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      post_slot:
        description: "Manual experiment slot."
        required: true
        default: "morning"
        type: choice
        options:
          - "morning"
          - "evening"
  schedule:
    # Daily 18:00 KST. GitHub Actions cron uses UTC, so this is 09:00 UTC.
    - cron: "0 9 * * *"

jobs:
  auto-publish:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      GROQ_MAX_OUTPUT_TOKENS: ${{ vars.GROQ_MAX_OUTPUT_TOKENS || '500' }}
      GENERATION_CANDIDATES: ${{ vars.GENERATION_CANDIDATES || '1' }}
      POSTS_PER_DAY: ${{ github.event_name == 'schedule' && '1' || inputs.posts_per_day || vars.POSTS_PER_DAY || '1' }}
      POST_SLOT: ${{ inputs.post_slot || 'morning' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_IMAGE_URL: ${{ vars.THREADS_IMAGE_URL || '' }}
      THREADS_ALT_TEXT: ${{ vars.THREADS_ALT_TEXT || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Resolve schedule experiment
        shell: pwsh
        run: |
          $schedule = "${{ github.event.schedule }}"
          if ($schedule -eq "0 9 * * *") {
            "POST_SLOT=evening" | Out-File -FilePath $env:GITHUB_ENV -Append
            "POSTS_PER_DAY=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "EXPERIMENT_GROUP=daily_1800_kst" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "EXPERIMENT_GROUP=manual_$env:POST_SLOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Collect candidates
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          .\scripts\run-daily-agentic-editor.ps1 -PerQuery 10 -PerFeed 10 -ReadmeTop 10 -Date $date

      - name: Generate approved chain
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          python .\scripts\generate_auto_thread.py `
            --date $date `
            --candidates-path ".\daily-editor\$date-candidates.json" `
            --output-path ".\approved-thread-chain.txt" `
            --metadata-path ".\daily-editor\auto-thread-metadata.json" `
            --metrics-path ".\threads-post-metrics.csv" `
            --posts-per-day ([int]$env:POSTS_PER_DAY) `
            --post-slot $env:POST_SLOT `
            --experiment-group $env:EXPERIMENT_GROUP

      - name: Validate generated chain
        shell: pwsh
        run: .\scripts\publish-approved-chain.ps1 -Topic "auto generated" -SourceCount 0 -DryRun

      - name: Publish generated chain
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        shell: pwsh
        run: |
          $metadata = Get-Content ".\daily-editor\auto-thread-metadata.json" -Raw | ConvertFrom-Json
          .\scripts\publish-approved-chain.ps1 `
            -Topic $metadata.topic `
            -Format $metadata.format `
            -ContentAxis $metadata.content_axis `
            -FormatType $metadata.format_type `
            -PostGoal $metadata.post_goal `
            -FinalCandidateScore ([string]$metadata.final_candidate_score) `
            -QualityScore ([string]$metadata.quality_score) `
            -SourceType $metadata.source_type `
            -PostSlot $metadata.post_slot `
            -ExperimentGroup $metadata.experiment_group `
            -Model $metadata.model `
            -SourceCount ([int]$metadata.source_count) `
            -SourceName $metadata.source_name `
            -SourceUrl $metadata.source_url `
            -Series $metadata.series `
            -SeriesPart $metadata.series_part `
            -PublicTheme $metadata.public_theme `
            -TopicPillar $metadata.topic_pillar `
            -WorkflowStage $metadata.workflow_stage `
            -FailureMode $metadata.failure_mode `
            -SolutionPattern $metadata.solution_pattern `
            -BadRequest $metadata.bad_request `
            -QuoteUsed:([bool]$metadata.quote_used) `
            -QuoteId $metadata.quote_id `
            -QuoteSpeaker $metadata.quote_speaker `
            -QuoteSourceUrl $metadata.quote_source_url `
            -HumanSignalSource $metadata.human_signal_source `
            -HumanSignalType $metadata.human_signal_type `
            -ResearchProblem $metadata.research_problem `
            -HookPattern $metadata.hook_pattern `
            -StructurePattern $metadata.structure_pattern `
            -CloserPattern $metadata.closer_pattern `
            -ReusableUnitType $metadata.reusable_unit_type `
            -CardUsed:([bool]$env:THREADS_IMAGE_URL)

      - name: Commit publish records
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path ".\content-history.jsonl") {
            git add -f content-history.jsonl
          }
          if (Test-Path ".\threads-post-metrics.csv") {
            git add -f threads-post-metrics.csv
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record published Threads source"
            git push
          }

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-thread-run
          path: |
            approved-thread-chain.txt
            content-history.jsonl
            threads-post-metrics.csv
            daily-editor/**
          if-no-files-found: ignore
