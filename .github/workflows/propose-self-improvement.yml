name: Propose Self Improvement

on:
  workflow_dispatch:
  schedule:
    # Monday 10:20 KST, after metrics and weekly editorial memory jobs.
    - cron: "20 1 * * 1"

jobs:
  propose-learnings:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Propose learnings and patterns
        shell: pwsh
        run: python .\scripts\propose_learnings.py --run-log-dir ".\daily-editor\runs" --evaluation-dir ".\daily-editor\evaluations" --metrics-path ".\threads-post-metrics.csv" --learnings-path ".\docs\learnings.md" --output-path ".\daily-editor\proposals\learnings.proposed.md" --pattern-proposals-dir ".\daily-editor\proposals"

      - name: Commit proposal updates
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-editor/proposals/learnings.proposed.md
          Get-ChildItem daily-editor/proposals -Filter *.pattern.proposed.md | ForEach-Object { git add $_.FullName }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Propose Threads self-improvement learnings"
            git push
          }
